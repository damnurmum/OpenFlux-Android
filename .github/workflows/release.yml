name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v0.3.0

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  android:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/mobile/go.sum

      - name: Build cross-platform binaries
        # The core is the upstream repository, checked out as core/.
        working-directory: core
        run: |
          mkdir -p ../dist
          build() { GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -o "../dist/openflux-$1-$2$3" .; }
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""
          build linux   arm   ""
          build linux   arm64 ""
          build windows 386   ".exe"
          build windows amd64 ".exe"
          build windows arm64 ".exe"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set)
      # but not on PATH - android-actions/setup-android@v3 used to add it
      # and is, as of this writing, broken, so add it ourselves instead.
      - name: Add Android cmdline-tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openflux-release.jks"
          chmod 600 "$RUNNER_TEMP/openflux-release.jks"

      - name: Build signed APKs
        env:
          BUILD_TYPE: release
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/openflux-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: GRADLE_BIN="$(command -v gradle)" ./build_android_app.sh

      - name: Verify APK signatures
        run: for apk in dist/OpenFlux-android-*-release.apk; do "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"; done

      - name: Generate checksums
        run: cd dist && sha256sum OpenFlux-android-*-release.apk openflux-* > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-${{ env.RELEASE_TAG }}
          path: |
            dist/OpenFlux-android-*-release.apk
            dist/openflux-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hand-written description in .github/release-notes/<tag>.md wins
          # over the generic one below.
          notes=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" \
              dist/OpenFlux-android-*-release.apk \
              dist/openflux-* \
              dist/SHA256SUMS \
              --verify-tag \
              --title "OpenFlux Android $RELEASE_TAG" \
              --notes-file "$notes"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/OpenFlux-android-*-release.apk \
            dist/openflux-* \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "OpenFlux Android $RELEASE_TAG" \
            --notes "Experimental Android 8+ builds. Choose arm64-v8a for most modern phones, armeabi-v7a for older 32-bit ARM devices, x86/x86_64 for compatible emulators, or universal when unsure. If a debug build is installed, uninstall it once before installing this signed release; later release updates preserve app data.

          Desktop CLI binaries for macOS (amd64, arm64), Linux (amd64, arm, arm64) and Windows (386, amd64, arm64) are included for exit-node deployment and desktop client use.

          Setup guide: https://github.com/damnurmum/OpenFlux-Android/blob/main/README.md (English) / https://github.com/damnurmum/OpenFlux-Android/blob/main/README.ru.md (Русский)."
