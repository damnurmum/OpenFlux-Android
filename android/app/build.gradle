plugins {
    id "com.android.application"
}

// The core this build ships and the exit node it is tested with, read from
// the core submodule so «О проекте» follows every core update by itself.
def coreDir = new File(rootDir, "../core")
def coreVersion = (new File(coreDir, "CHANGELOG.md").text =~ /(?m)^## \[(\d+\.\d+\.\d+)\]/)[0][1]
def nodeVersion = (new File(coreDir, "deploy/node-install.sh").text =~ /(?m)^CORE_VERSION="([^"]+)"/)[0][1]

android {
    namespace "io.openflux.app"
    compileSdk 35

    defaultConfig {
        applicationId "io.openflux.app"
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName "1.1.7"

        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        buildConfigField "String", "NODE_VERSION", "\"${nodeVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            universalApk true
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The JS transports OpenFlux signs (see bundledScripts below), installed
    // when the experimental features are turned on.
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/bundledScripts"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// The same set upstream's app ships, straight from the core submodule so it
// follows each core update; MAX (oneme) is left out, as there.
def bundledScripts = tasks.register("bundledScripts", Copy) {
    from("$rootDir/../core/transport/script/js") {
        include "yandex.js*", "vyandex.js*", "boards.js*", "mailru.js*", "cupsonline.js*"
    }
    into "$buildDir/generated/bundledScripts/scripts"
}
tasks.named("preBuild") { dependsOn bundledScripts }

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation files("libs/openflux.aar")
    implementation "com.google.zxing:core:3.5.3"
    // Camera scanner for openflux:// QR codes.
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    // ProxyController: routes the captcha WebView through the tunnel when the
    // check belongs to the exit node.
    implementation "androidx.webkit:webkit:1.12.1"
}
